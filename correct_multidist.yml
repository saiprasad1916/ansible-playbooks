---
- name: Update all servers
  hosts: all
  become: yes

  tasks:
    - name: Ensure Install Apache on Ubuntu
      package:
        name: apache2
        state: present
      when: ansible_distribution == "Ubuntu"

    - name: Ensure Start Apache on Ubuntu
      service:
        name: apache2
        state: started
      when: ansible_distribution == "Ubuntu"

    - name: Ensure Enable Apache on Ubuntu
      service:
        name: apache2
        enabled: true
      when: ansible_distribution == "Ubuntu"

    - name: Ensure Install httpd on CentOS
      package:
        name: httpd
        state: present
      when: ansible_distribution == "CentOS"

    - name: Ensure Start Apache on CentOS
      service:
        name: httpd
        state: started
      when: ansible_distribution == "CentOS"

    - name: Ensure Enable Apache on CentOS
      service:
        name: httpd
        enabled: true
      when: ansible_distribution == "CentOS"